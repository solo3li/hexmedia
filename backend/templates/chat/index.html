<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HexMedia | أستوديو الروايات والدراما الصوتية</title>
  
  <!-- Google Fonts: IBM Plex Sans Arabic & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            obsidian: '#08080a',
            surface: '#0e0e12',
            surfaceHover: '#14141a',
            borderSubtle: '#1c1c22',
            limeAccent: '#e2ff44',
            muted: '#71717a',
            light: '#f4f4f6'
          },
          fontFamily: {
            sans: ['"IBM Plex Sans Arabic"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>

  <style>
    * {
      box-sizing: border-box;
      scrollbar-width: thin;
      scrollbar-color: #1c1c22 transparent;
    }

    *::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    *::-webkit-scrollbar-track {
      background: transparent;
    }
    *::-webkit-scrollbar-thumb {
      background: #1c1c22;
      border-radius: 9999px;
    }

    body {
      background-color: #08080a;
      color: #f4f4f6;
      font-family: 'IBM Plex Sans Arabic', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .wave-bar {
      transition: height 0.14s ease, background-color 0.2s ease;
    }

    .floating-dock {
      background: rgba(14, 14, 18, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    [contenteditable="true"]:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 6px;
    }

    @keyframes pulseLive {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.9); }
    }
    .pulse-live {
      animation: pulseLive 1.5s infinite ease-in-out;
    }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden flex select-none bg-obsidian text-light">

  <!-- 1. ULTRA-CLEAN RIGHT SIDEBAR (RTL) -->
  <aside id="sidebar" class="w-64 bg-surface border-l border-borderSubtle flex flex-col justify-between shrink-0 transition-all duration-300 z-30">
    
    <div class="p-5">
      <!-- Minimal Brand Header -->
      <div class="flex items-center justify-between mb-8">
        <div class="flex items-center gap-2.5">
          <div class="w-7 h-7 rounded-lg bg-obsidian border border-borderSubtle flex items-center justify-center">
            <svg class="w-4 h-4 text-limeAccent" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <polygon points="12 2 21 7 21 17 12 22 3 17 3 7 12 2"></polygon>
              <circle cx="12" cy="12" r="2" fill="#e2ff44" stroke="none"></circle>
            </svg>
          </div>
          <span class="font-medium tracking-wide text-sm text-white">HexMedia</span>
        </div>

        <button onclick="toggleSidebar()" title="طي القائمة" class="p-1.5 rounded-lg text-muted hover:text-white hover:bg-obsidian transition-colors md:hidden">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <!-- Minimal Upload Novel Button -->
      <input type="file" id="novelFileInput" accept=".pdf,.epub,.txt" class="hidden" onchange="handleFileUpload(event)">
      <button onclick="document.getElementById('novelFileInput').click()" class="w-full py-2.5 px-3.5 rounded-xl bg-obsidian hover:bg-surfaceHover border border-borderSubtle hover:border-limeAccent/40 text-xs font-medium text-light flex items-center justify-between transition-all group shadow-sm active:scale-[0.98]">
        <span>رفع رواية جديدة</span>
        <svg class="w-3.5 h-3.5 text-muted group-hover:text-limeAccent transition-colors" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>

      <!-- Projects List -->
      <div class="mt-8">
        <span class="block text-[11px] text-muted mb-3 px-2 font-normal">الأعمال والروايات</span>
        <div id="projectsList" class="space-y-1 overflow-y-auto max-h-[calc(100vh-280px)]">
          <!-- Populated by JS -->
        </div>
      </div>
    </div>

    <!-- Subtle Minimal Footer -->
    <div class="p-5 border-t border-borderSubtle flex items-center justify-between text-[11px] text-muted">
      <div class="flex items-center gap-1.5">
        <span class="w-1.5 h-1.5 rounded-full bg-limeAccent"></span>
        <span>Gemini 3.8 Flash</span>
      </div>
      <a href="/admin/ai_studio/aiconfiguration/" target="_blank" class="font-mono text-[10px] text-zinc-500 hover:text-white transition">API Settings</a>
    </div>
  </aside>

  <!-- MAIN AREA -->
  <div class="flex-1 flex flex-col h-full overflow-hidden relative">

    <!-- 2. MINIMAL TOP HEADER -->
    <header class="h-16 px-8 border-b border-borderSubtle flex items-center justify-between shrink-0 bg-obsidian/90 backdrop-blur-md z-10">
      
      <!-- Right: Novel Title & Chapter Selector -->
      <div class="flex items-center gap-3">
        <button onclick="toggleSidebar()" class="p-1.5 rounded-lg text-muted hover:text-white md:hidden">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
        <h1 id="headerTitle" class="text-sm font-medium text-white truncate max-w-[240px] sm:max-w-xs">جاري التحميل...</h1>
        <span class="text-borderSubtle">/</span>
        <div class="relative">
          <select id="chapterSelector" onchange="handleChapterChange(this.value)" class="appearance-none bg-surface hover:bg-surfaceHover border border-borderSubtle rounded-lg pl-7 pr-3 py-1 text-xs text-muted hover:text-white focus:outline-none cursor-pointer transition-colors font-mono">
            <!-- Populated by JS -->
          </select>
          <svg class="w-3 h-3 text-muted absolute left-2.5 top-1/2 -translate-y-1/2 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </div>
      </div>

      <!-- Center: Narrator Mode Minimalist Segmented Pill Control -->
      <div class="hidden sm:flex items-center bg-surface p-1 rounded-full border border-borderSubtle">
        <button onclick="setNarratorMode('SMART')" id="mode-SMART" class="px-3.5 py-1 rounded-full text-xs font-medium bg-obsidian text-white border border-borderSubtle transition-all">
          سرد ذكي
        </button>
        <button onclick="setNarratorMode('FULL')" id="mode-FULL" class="px-3.5 py-1 rounded-full text-xs font-medium text-muted hover:text-white border border-transparent transition-all">
          سرد كامل
        </button>
        <button onclick="setNarratorMode('NONE')" id="mode-NONE" class="px-3.5 py-1 rounded-full text-xs font-medium text-muted hover:text-white border border-transparent transition-all">
          حوار فقط
        </button>
      </div>

      <!-- Left: Open Studio & Export Button -->
      <div class="flex items-center gap-2.5">
        <button onclick="openDesignComboStudio()" title="فتح في استوديو المونتاج" class="hidden md:flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-surface hover:bg-surfaceHover border border-borderSubtle text-xs text-muted hover:text-white transition-colors">
          <svg class="w-3 h-3 text-limeAccent" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <line x1="4" y1="21" x2="4" y2="14"></line>
            <line x1="4" y1="10" x2="4" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12" y2="3"></line>
            <line x1="20" y1="21" x2="20" y2="16"></line>
            <line x1="20" y1="12" x2="20" y2="3"></line>
            <line x1="1" y1="14" x2="7" y2="14"></line>
            <line x1="9" y1="8" x2="15" y2="8"></line>
            <line x1="17" y1="16" x2="23" y2="16"></line>
          </svg>
          <span>الاستوديو</span>
        </button>

        <button onclick="exportAudioMaster()" class="px-4 py-1.5 rounded-full bg-white hover:bg-limeAccent text-obsidian font-medium text-xs flex items-center gap-2 transition-colors active:scale-95 shadow-sm">
          <span>تصدير</span>
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
        </button>
      </div>

    </header>

    <!-- 3. MAIN WORKSPACE (Centered, Max-Width 820px, Generous Breathing Room) -->
    <main class="flex-1 overflow-y-auto px-6 pt-8 pb-36" id="workspaceContainer">
      <div class="max-w-[820px] mx-auto">

        <!-- Compact Cast Bar (Character Voice Pills) -->
        <div class="mb-8 flex items-center justify-between gap-4 flex-wrap">
          <div id="castBar" class="flex items-center gap-2 flex-wrap">
            <!-- Populated by JS -->
          </div>
          <div class="flex items-center gap-2">
            <button onclick="executeActiveChapter()" id="executeChapterBtn" class="hidden px-3 py-1 rounded-full bg-limeAccent/10 hover:bg-limeAccent/20 border border-limeAccent/30 text-limeAccent font-medium text-xs transition flex items-center gap-1.5">
              <span>🎙️ توليد صوت الفصل</span>
            </button>
            <span id="blockCountLabel" class="font-mono text-[11px] text-muted">00 مقاطع</span>
          </div>
        </div>

        <!-- Minimalist Scene Script & Audio Blocks -->
        <div id="scriptList" class="space-y-3">
          <!-- Populated by JS -->
        </div>

        <!-- Empty State Prompt -->
        <div id="emptyScriptState" class="hidden text-center py-20 space-y-4 border border-dashed border-borderSubtle rounded-3xl p-8 my-6">
          <div class="w-10 h-10 mx-auto rounded-full bg-surface border border-borderSubtle flex items-center justify-center text-muted">
            <svg class="w-5 h-5 text-limeAccent" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <polygon points="12 2 21 7 21 17 12 22 3 17 3 7 12 2"></polygon>
            </svg>
          </div>
          <h3 class="text-sm font-medium text-white">لا توجد مشاهد صوتية منشأة لهذا الفصل بعد</h3>
          <p class="text-xs text-muted max-w-sm mx-auto">اضغط زر "توليد صوت الفصل" أو اكتب فكرة مشهد في الشريط السفلي ليبدأ المخرج بالإنتاج فوراً.</p>
          <button onclick="executeActiveChapter()" class="px-5 py-2 rounded-full bg-limeAccent text-obsidian text-xs font-semibold hover:bg-[#d5f533] transition shadow-sm">
            🎙️ توليد وتنفيذ مشاهد الفصل الآن
          </button>
        </div>

      </div>
    </main>

    <!-- 4. FLOATING MINIMAL BOTTOM DOCK -->
    <div class="absolute bottom-6 inset-x-0 px-6 pointer-events-none z-20">
      <div class="max-w-[760px] mx-auto floating-dock border border-borderSubtle rounded-full p-2 pl-3 pr-2.5 shadow-2xl flex items-center gap-3 pointer-events-auto">
        
        <!-- Master Play/Pause Button -->
        <button id="masterPlayBtn" onclick="toggleMasterPlay()" title="تشغيل كل المشاهد بالتتابع" class="w-9 h-9 rounded-full bg-limeAccent hover:bg-[#d5f533] text-obsidian flex items-center justify-center shrink-0 transition-transform active:scale-95 shadow-sm">
          <svg id="masterPlayIcon" class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor" stroke="none">
            <polygon points="6 4 20 12 6 20 6 4"></polygon>
          </svg>
        </button>

        <!-- Timecode + Minimal Interactive Progress Line -->
        <div class="hidden sm:flex items-center gap-3 w-48 shrink-0">
          <span id="masterTimecode" class="font-mono text-[11px] text-muted whitespace-nowrap">00:00 / 00:00</span>
          <div onclick="seekMasterProgress(event)" class="flex-1 h-1.5 bg-borderSubtle rounded-full overflow-hidden cursor-pointer relative" title="تقديم / ترجيع">
            <div id="masterProgressFill" class="h-full bg-limeAccent rounded-full transition-all duration-150" style="width: 0%"></div>
          </div>
        </div>

        <div class="h-4 w-[1px] bg-borderSubtle hidden sm:block"></div>

        <!-- Clean Minimal Input Field -->
        <input 
          id="directorInput" 
          type="text" 
          placeholder="أضف مشهداً، عدّل النبرة، أو اكتب 'نفذ' لتوليد الفصل..." 
          onkeydown="if(event.key === 'Enter') handleInputSubmit()"
          class="flex-1 bg-transparent text-xs text-white placeholder-muted focus:outline-none px-2"
        >

        <!-- Generate Arrow Button -->
        <button id="submitBtn" onclick="handleInputSubmit()" title="إرسال وتوليد" class="w-8 h-8 rounded-full bg-surface hover:bg-white text-light hover:text-obsidian border border-borderSubtle flex items-center justify-center shrink-0 transition-colors active:scale-95">
          <svg id="submitIcon" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
        </button>

      </div>
    </div>

  </div>

  <!-- VOICE CASTING MINIMAL POPOVER (Modal) -->
  <div id="voiceModal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 hidden">
    <div class="bg-surface border border-borderSubtle rounded-2xl p-5 max-w-sm w-full space-y-4 shadow-2xl" onclick="event.stopPropagation()">
      <div class="flex items-center justify-between border-b border-borderSubtle pb-3">
        <div class="flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-limeAccent"></span>
          <span class="text-xs font-medium text-white" id="modalCharName">تخصيص صوت الشخصية</span>
        </div>
        <button onclick="closeVoiceModal()" class="text-muted hover:text-white transition">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <div class="space-y-3">
        <label class="block text-[11px] text-muted font-normal">اختر صوت Gemini TTS المخصص:</label>
        <div id="voiceOptionsList" class="space-y-1.5 max-h-56 overflow-y-auto">
          <!-- Populated by JS -->
        </div>
      </div>

      <div class="pt-2 flex items-center justify-end gap-2 border-t border-borderSubtle">
        <button onclick="closeVoiceModal()" class="px-3 py-1.5 rounded-lg text-xs text-muted hover:text-white hover:bg-obsidian transition">إلغاء</button>
        <button onclick="saveVoiceAssignment()" class="px-4 py-1.5 rounded-lg bg-limeAccent hover:bg-[#d5f533] text-obsidian text-xs font-semibold transition">حفظ التعيين</button>
      </div>
    </div>
  </div>

  <!-- MINIMAL STATUS NOTIFICATION (Toast) -->
  <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-full bg-surface border border-borderSubtle text-xs text-light shadow-xl flex items-center gap-2 opacity-0 pointer-events-none transition-all duration-200">
    <span class="w-1.5 h-1.5 rounded-full bg-limeAccent" id="toastDot"></span>
    <span id="toastText"></span>
  </div>

  <script>
    // =========================================================================
    // STATE INITIALIZATION FROM SERVER CONTEXT
    // =========================================================================
    const initialProject = {{ initial_project_json|safe }};
    const projectsList = {{ projects_list_json|safe }};
    const availableVoices = {{ available_voices_json|safe }};

    let activeProject = initialProject || null;
    let activeProjectId = activeProject ? activeProject.id : (projectsList[0] ? projectsList[0].id : null);
    let activeChapterNumber = 1;
    let activeBlockId = null;
    let isMasterPlaying = false;
    let currentNarratorMode = activeProject ? (activeProject.narration_mode || 'SMART') : 'SMART';
    let currentAudioElement = null;
    let masterSequenceList = [];
    let masterSequenceIndex = 0;
    let waveTimer = null;
    let targetCharForVoice = null;
    let selectedVoiceForModal = null;

    // =========================================================================
    // BOOTSTRAP
    // =========================================================================
    window.addEventListener('DOMContentLoaded', () => {
      renderSidebarProjects();
      if (activeProject) {
        if (activeProject.chapters && activeProject.chapters.length) {
          activeChapterNumber = activeProject.chapters[0].number;
        }
        renderWorkspace();
      } else if (projectsList.length) {
        selectProject(projectsList[0].id);
      } else {
        renderWorkspace();
      }
    });

    function showToast(msg, isWarning = false) {
      const toast = document.getElementById('toast');
      const dot = document.getElementById('toastDot');
      document.getElementById('toastText').textContent = msg;
      dot.className = `w-1.5 h-1.5 rounded-full ${isWarning ? 'bg-amber-400' : 'bg-limeAccent'}`;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      toast.classList.add('opacity-100');
      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 2600);
    }

    function toggleSidebar() {
      const sb = document.getElementById('sidebar');
      sb.classList.toggle('hidden');
    }

    function openDesignComboStudio() {
      if (!activeProjectId) return;
      const url = `${window.location.protocol}//${window.location.hostname}:5173/?project_id=${activeProjectId}`;
      window.open(url, '_blank');
    }

    // =========================================================================
    // SIDEBAR RENDERING
    // =========================================================================
    function renderSidebarProjects() {
      const list = document.getElementById('projectsList');
      if (!projectsList.length) {
        list.innerHTML = `<div class="text-[11px] text-zinc-600 px-3 py-4 text-center">لا توجد مشاريع سابقة.<br>ارفع أول كتاب للبدء.</div>`;
        return;
      }

      list.innerHTML = projectsList.map(proj => {
        const isActive = proj.id === activeProjectId;
        const dotColor = proj.status === 'READY' 
          ? 'bg-limeAccent' 
          : proj.status === 'GENERATING_AUDIO' || proj.status === 'CONTINUOUS_GENERATING'
            ? 'bg-amber-400 pulse-live' 
            : 'bg-zinc-600';

        return `
          <button 
            onclick="selectProject('${proj.id}')" 
            class="w-full px-3 py-2.5 rounded-xl flex items-center justify-between text-right transition-all ${
              isActive 
                ? 'bg-obsidian text-white border border-borderSubtle' 
                : 'text-muted hover:text-light hover:bg-obsidian/40 border border-transparent'
            }"
          >
            <span class="text-xs font-normal truncate">${escapeHtml(proj.title)}</span>
            <span class="w-1.5 h-1.5 rounded-full ${dotColor} shrink-0"></span>
          </button>
        `;
      }).join('');
    }

    async function selectProject(id) {
      if (id === activeProjectId && activeProject) return;
      stopAllPlayback();
      activeProjectId = id;
      renderSidebarProjects();

      try {
        const res = await fetch(`/api/projects/${id}/timeline`);
        if (!res.ok) throw new Error("Failed to load project");
        const data = await res.json();
        
        // Fetch chapters
        const chRes = await fetch(`/api/projects/${id}/chapters`);
        const chData = await chRes.json();

        // Extract scenes from timeline tracks
        const dialogueTrack = (data.timeline && data.timeline.tracks) 
          ? data.timeline.tracks.find(t => t.id === 'track_dialogue' || t.id.includes('dialogue')) 
          : null;

        const scenes = [];
        if (dialogueTrack && dialogueTrack.items) {
          dialogueTrack.items.forEach((item, idx) => {
            scenes.push({
              id: item.metadata?.scene_id || item.id,
              order: idx + 1,
              speaker_name: item.metadata?.speaker || (item.name ? item.name.split(':')[0] : 'الراوي'),
              raw_text: item.metadata?.text || item.name || '',
              vocalized_text: item.metadata?.vocalized || item.metadata?.text || item.name || '',
              audio_url: item.details?.src || '',
              duration: Math.round((item.display.to - item.display.from) * 10) / 10,
              duration_formatted: formatDurationMinSec(item.display.to - item.display.from)
            });
          });
        }

        activeProject = {
          id: data.project.id,
          title: data.project.title,
          author: data.project.author,
          status: data.project.status,
          narration_mode: 'SMART',
          chapters: chData.chapters || [],
          scenes: scenes,
          characters: []
        };

        if (activeProject.chapters && activeProject.chapters.length) {
          activeChapterNumber = activeProject.chapters[0].number;
        }

        window.history.replaceState(null, '', `?project_id=${id}`);
        renderWorkspace();
      } catch (err) {
        window.location.href = `?project_id=${id}`;
      }
    }

    // =========================================================================
    // WORKSPACE RENDERING
    // =========================================================================
    function renderWorkspace() {
      if (!activeProject) {
        document.getElementById('headerTitle').textContent = 'لا يوجد مشروع نشط';
        document.getElementById('castBar').innerHTML = '';
        document.getElementById('scriptList').innerHTML = '';
        document.getElementById('emptyScriptState').classList.remove('hidden');
        return;
      }

      document.getElementById('headerTitle').textContent = activeProject.title || 'رواية جديدة';

      // 1. Chapters Selector
      const chapterSelector = document.getElementById('chapterSelector');
      if (activeProject.chapters && activeProject.chapters.length) {
        chapterSelector.classList.remove('hidden');
        chapterSelector.innerHTML = activeProject.chapters.map(ch => `
          <option value="${ch.number}" ${ch.number === activeChapterNumber ? 'selected' : ''}>
            ${escapeHtml(ch.title || `الفصل ${ch.number}`)}
          </option>
        `).join('');
      } else {
        chapterSelector.innerHTML = `<option value="1">الفصل الأول</option>`;
      }

      // 2. Narrator Mode Pills
      setNarratorModeUI(activeProject.narration_mode || currentNarratorMode);

      // 3. Cast Bar Pills
      const castBar = document.getElementById('castBar');
      const chars = activeProject.characters && activeProject.characters.length
        ? activeProject.characters
        : extractCharactersFromScenes(activeProject.scenes);

      castBar.innerHTML = chars.map(c => `
        <button 
          onclick="openVoiceModal('${escapeHtml(c.name)}', '${c.assigned_voice || 'Charon'}')" 
          title="انقر لتخصيص ومعاينة الصوت: ${c.assigned_voice || 'Charon'}"
          class="px-3 py-1.5 rounded-full bg-surface hover:bg-surfaceHover border border-borderSubtle hover:border-limeAccent/40 flex items-center gap-2 text-xs text-light transition-all group"
        >
          <svg class="w-3 h-3 text-muted group-hover:text-limeAccent transition-colors" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M2 12h3l2-6 4 12 4-9 2 3h5"></path>
          </svg>
          <span class="font-normal">${escapeHtml(c.name)}</span>
          <span class="text-[9px] font-mono text-zinc-500 group-hover:text-zinc-400">(${c.assigned_voice || 'Gemini'})</span>
        </button>
      `).join('');

      // 4. Script Rows
      const scriptList = document.getElementById('scriptList');
      const emptyState = document.getElementById('emptyScriptState');
      const executeBtn = document.getElementById('executeChapterBtn');

      // Filter by narrator mode if dialogue only
      let visibleScenes = activeProject.scenes || [];
      if (currentNarratorMode === 'NONE') {
        visibleScenes = visibleScenes.filter(s => s.speaker_name !== 'الراوي');
      }

      if (!visibleScenes.length) {
        scriptList.innerHTML = '';
        emptyState.classList.remove('hidden');
        executeBtn.classList.remove('hidden');
        document.getElementById('blockCountLabel').textContent = '00 مقاطع';
        return;
      }

      emptyState.classList.add('hidden');
      executeBtn.classList.add('hidden');
      document.getElementById('blockCountLabel').textContent = `${String(visibleScenes.length).padStart(2, '0')} مقاطع`;

      // Calculate total duration for master dock
      let totalSecs = visibleScenes.reduce((acc, s) => acc + (s.duration || 3), 0);
      document.getElementById('masterTimecode').textContent = `00:00 / ${formatDurationMinSec(totalSecs)}`;

      scriptList.innerHTML = visibleScenes.map((block, idx) => {
        const isPlaying = activeBlockId === block.id;
        const isNarrator = block.speaker_name === 'الراوي';

        // Render minimal 24-bar waveform
        let bars = '';
        for (let i = 0; i < 24; i++) {
          const h = 25 + ((i * 17 + idx * 11) % 70);
          const colorClass = isPlaying ? 'bg-limeAccent' : 'bg-zinc-700 group-hover:bg-zinc-500';
          bars += `<span class="wave-bar w-[2px] rounded-full ${colorClass}" data-base="${h}" style="height: ${h}%"></span>`;
        }

        return `
          <div id="block-${block.id}" class="group p-4 rounded-2xl bg-surface hover:bg-surfaceHover border ${isPlaying ? 'border-limeAccent/50' : 'border-borderSubtle'} flex items-center justify-between gap-5 transition-all">
            
            <!-- Right: Play/Pause Circular Minimal Button -->
            <button 
              onclick="toggleBlockPlay('${block.id}', '${block.audio_url}', ${idx})" 
              class="w-9 h-9 rounded-full ${isPlaying ? 'bg-limeAccent text-obsidian' : 'bg-obsidian text-light hover:border-limeAccent/50'} border border-borderSubtle flex items-center justify-center shrink-0 transition-all active:scale-95 shadow-sm"
              title="${isPlaying ? 'إيقاف مؤقت' : 'تشغيل المقطع'}"
            >
              ${isPlaying 
                ? `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg>`
                : `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20 6 4"></polygon></svg>`
              }
            </button>

            <!-- Middle: Character Name Tag + Editable Clean Arabic Script -->
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2 mb-1">
                <span class="text-[11px] font-medium ${isNarrator ? 'text-limeAccent' : 'text-muted'}">${escapeHtml(block.speaker_name)}</span>
                ${block.sfx_name ? `<span class="text-[9px] font-mono px-1.5 py-0.2 rounded bg-surface border border-borderSubtle text-amber-300">⚡ ${block.sfx_name}</span>` : ''}
              </div>
              <p 
                contenteditable="true" 
                spellcheck="false" 
                class="text-sm text-light leading-relaxed font-normal px-1 -mx-1"
                onblur="handleInlineTextEdit('${block.id}', this)"
                onkeydown="if(event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); this.blur(); }"
              >${escapeHtml(block.vocalized_text || block.raw_text)}</p>
            </div>

            <!-- Left: Interactive Minimal Waveform + Timecode + Hover Actions -->
            <div class="flex items-center gap-4 shrink-0">
              
              <!-- Subtle Hover Actions (Regenerate / Delete) -->
              <div class="hidden md:flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                <button onclick="regenerateBlock('${block.id}')" title="إعادة توليد صوت هذا المقطع" class="p-1.5 rounded-lg text-muted hover:text-white hover:bg-obsidian transition-colors">
                  <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <polyline points="23 4 23 10 17 10"></polyline>
                    <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                  </svg>
                </button>
                <button onclick="deleteBlock('${block.id}')" title="حذف المقطع" class="p-1.5 rounded-lg text-muted hover:text-red-400 hover:bg-obsidian transition-colors">
                  <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                  </svg>
                </button>
              </div>

              <!-- Minimal Waveform -->
              <div onclick="toggleBlockPlay('${block.id}', '${block.audio_url}', ${idx})" class="w-24 h-7 flex items-center justify-between gap-[2px] cursor-pointer" title="تشغيل / إيقاف">
                ${bars}
              </div>

              <!-- Monospace Timecode -->
              <span class="font-mono text-[11px] text-muted w-10 text-left">${block.duration_formatted || formatDurationMinSec(block.duration)}</span>
            </div>

          </div>
        `;
      }).join('');
    }

    function extractCharactersFromScenes(scenes) {
      if (!scenes || !scenes.length) return [{ name: 'الراوي', assigned_voice: 'Charon' }];
      const map = {};
      scenes.forEach(s => {
        if (!map[s.speaker_name]) {
          map[s.speaker_name] = {
            name: s.speaker_name,
            assigned_voice: s.voice || (s.speaker_name === 'الراوي' ? 'Charon' : 'Puck')
          };
        }
      });
      return Object.values(map);
    }

    function formatDurationMinSec(sec) {
      const s = Math.floor(sec || 0);
      const mins = Math.floor(s / 60);
      const remainingSecs = s % 60;
      return `${mins.toString().padStart(2, '0')}:${remainingSecs.toString().padStart(2, '0')}`;
    }

    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // =========================================================================
    // AUDIO ENGINE & WAVEFORM INTERACTIONS
    // =========================================================================
    function toggleBlockPlay(blockId, audioUrl, index) {
      if (activeBlockId === blockId) {
        stopAllPlayback();
        return;
      }

      stopAllPlayback();
      activeBlockId = blockId;
      isMasterPlaying = true;
      updateMasterDockIcon();
      renderWorkspace();

      if (audioUrl) {
        currentAudioElement = new Audio(audioUrl);
        currentAudioElement.play().catch(e => console.warn(e));
        startWaveformAnimation(blockId);

        currentAudioElement.ontimeupdate = () => {
          if (!currentAudioElement) return;
          const cur = currentAudioElement.currentTime;
          const dur = currentAudioElement.duration || 1;
          const pct = Math.min(100, Math.round((cur / dur) * 100));
          document.getElementById('masterProgressFill').style.width = `${pct}%`;
          document.getElementById('masterTimecode').textContent = `${formatDurationMinSec(cur)} / ${formatDurationMinSec(dur)}`;
        };

        currentAudioElement.onended = () => {
          stopAllPlayback();
        };
      }
    }

    function toggleMasterPlay() {
      if (!activeProject || !activeProject.scenes || !activeProject.scenes.length) return;

      if (isMasterPlaying) {
        stopAllPlayback();
      } else {
        masterSequenceList = [...activeProject.scenes];
        masterSequenceIndex = 0;
        isMasterPlaying = true;
        updateMasterDockIcon();
        playSequenceItem(0);
      }
    }

    function playSequenceItem(index) {
      if (!isMasterPlaying || index >= masterSequenceList.length) {
        stopAllPlayback();
        return;
      }

      masterSequenceIndex = index;
      const block = masterSequenceList[index];
      activeBlockId = block.id;
      renderWorkspace();

      if (block.audio_url) {
        if (currentAudioElement) {
          currentAudioElement.pause();
          currentAudioElement = null;
        }

        currentAudioElement = new Audio(block.audio_url);
        currentAudioElement.play().catch(e => console.warn(e));
        startWaveformAnimation(block.id);

        currentAudioElement.ontimeupdate = () => {
          if (!currentAudioElement) return;
          const cur = currentAudioElement.currentTime;
          const dur = currentAudioElement.duration || 1;
          const pct = Math.min(100, Math.round((cur / dur) * 100));
          document.getElementById('masterProgressFill').style.width = `${pct}%`;
        };

        currentAudioElement.onended = () => {
          playSequenceItem(index + 1);
        };
      } else {
        setTimeout(() => playSequenceItem(index + 1), 2000);
      }
    }

    function startWaveformAnimation(blockId) {
      clearInterval(waveTimer);
      waveTimer = setInterval(() => {
        const row = document.getElementById(`block-${blockId}`);
        if (!row) return;
        const bars = row.querySelectorAll('.wave-bar');
        bars.forEach(bar => {
          const randHeight = 20 + Math.floor(Math.random() * 78);
          bar.style.height = `${randHeight}%`;
        });
      }, 140);
    }

    function stopAllPlayback() {
      clearInterval(waveTimer);
      if (currentAudioElement) {
        currentAudioElement.pause();
        currentAudioElement = null;
      }
      activeBlockId = null;
      isMasterPlaying = false;
      updateMasterDockIcon();
      document.getElementById('masterProgressFill').style.width = '0%';
      renderWorkspace();
    }

    function updateMasterDockIcon() {
      const btnIcon = document.getElementById('masterPlayIcon');
      if (isMasterPlaying) {
        btnIcon.innerHTML = '<rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect>';
      } else {
        btnIcon.innerHTML = '<polygon points="6 4 20 12 6 20 6 4"></polygon>';
      }
    }

    function seekMasterProgress(e) {
      if (!currentAudioElement || !currentAudioElement.duration) return;
      const rect = e.currentTarget.getBoundingClientRect();
      const pct = Math.max(0, Math.min(1, 1 - ((e.clientX - rect.left) / rect.width)));
      currentAudioElement.currentTime = pct * currentAudioElement.duration;
      document.getElementById('masterProgressFill').style.width = `${Math.round(pct * 100)}%`;
    }

    // =========================================================================
    // NARRATOR MODE SELECTION
    // =========================================================================
    function setNarratorModeUI(mode) {
      ['SMART', 'FULL', 'NONE'].forEach(m => {
        const btn = document.getElementById(`mode-${m}`);
        if (!btn) return;
        if (m === mode) {
          btn.className = 'px-3.5 py-1 rounded-full text-xs font-medium bg-obsidian text-white border border-borderSubtle transition-all';
        } else {
          btn.className = 'px-3.5 py-1 rounded-full text-xs font-medium text-muted hover:text-white border border-transparent transition-all';
        }
      });
    }

    async function setNarratorMode(mode) {
      currentNarratorMode = mode;
      setNarratorModeUI(mode);
      if (activeProject) {
        activeProject.narration_mode = mode;
        try {
          await fetch(`/api/projects/${activeProjectId}/set-narration-mode`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ narration_mode: mode })
          });
          showToast(`تم ضبط السرد: ${mode === 'SMART' ? 'سرد ذكي' : mode === 'FULL' ? 'سرد كامل' : 'حوار فقط'}`);
        } catch (e) {
          console.error(e);
        }
      }
      renderWorkspace();
    }

    // =========================================================================
    // INLINE SCRIPT EDITING & ACTIONS
    // =========================================================================
    async function handleInlineTextEdit(blockId, el) {
      const newText = el.innerText.trim();
      if (!activeProject || !newText) return;
      const block = activeProject.scenes.find(s => s.id === blockId);
      if (!block || block.raw_text === newText) return;

      block.raw_text = newText;
      block.vocalized_text = newText;
      showToast('تم تعديل النص. اضغط 🔄 لتحديث الصوت الجديد.');
    }

    async function regenerateBlock(blockId) {
      const block = activeProject.scenes.find(s => s.id === blockId);
      if (!block) return;

      showToast('جاري إعادة توليد الصوت عبر Gemini TTS...');
      try {
        const res = await fetch(`/api/scenes/${blockId}/regenerate`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: block.vocalized_text || block.raw_text })
        });
        const data = await res.json();
        if (data.success && data.scene) {
          block.audio_url = data.scene.audio_url;
          block.duration = data.scene.duration;
          block.duration_formatted = formatDurationMinSec(data.scene.duration);
          renderWorkspace();
          toggleBlockPlay(block.id, block.audio_url, 0);
          showToast('تم تحديث وتوليد الصوت بنجاح!');
        }
      } catch (err) {
        showToast('تعذر تجديد الصوت: ' + err.message, true);
      }
    }

    async function deleteBlock(blockId) {
      if (!confirm("هل أنت متأكد من حذف هذا المشهد؟")) return;
      try {
        await fetch(`/api/scenes/${blockId}`, { method: 'DELETE' });
        activeProject.scenes = activeProject.scenes.filter(s => s.id !== blockId);
        if (activeBlockId === blockId) stopAllPlayback();
        renderWorkspace();
        showToast('تم حذف المشهد.');
      } catch (err) {
        showToast('تعذر حذف المشهد.', true);
      }
    }

    // =========================================================================
    // CHAPTER EXECUTION & INPUT COMMANDS
    // =========================================================================
    async function handleChapterChange(chNumber) {
      activeChapterNumber = parseInt(chNumber, 10);
      showToast(`انتقلت إلى الفصل ${activeChapterNumber}`);
      executeActiveChapter();
    }

    async function executeActiveChapter() {
      if (!activeProjectId) return;
      showToast(`جاري تنفيذ وتوليد مشاهد الفصل ${activeChapterNumber}...`);
      
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.classList.add('animate-pulse');

      try {
        const res = await fetch(`/api/projects/${activeProjectId}/execute-chapter`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ chapter_number: activeChapterNumber })
        });
        const data = await res.json();
        submitBtn.classList.remove('animate-pulse');

        if (data.metadata && data.metadata.scenes) {
          activeProject.scenes = data.metadata.scenes.map(s => ({
            id: s.id,
            order: s.order,
            chapter: s.chapter,
            speaker_name: s.speaker_name,
            voice: s.voice,
            raw_text: s.raw_text,
            vocalized_text: s.vocalized_text,
            audio_url: s.audio_url,
            duration: s.duration,
            duration_formatted: formatDurationMinSec(s.duration),
            sfx_name: s.sfx_name
          }));
          renderWorkspace();
          showToast(`تم إنتاج ${activeProject.scenes.length} مشهداً صوتياً بنجاح!`);
        } else {
          // Re-fetch timeline
          selectProject(activeProjectId);
        }
      } catch (err) {
        submitBtn.classList.remove('animate-pulse');
        showToast('خطأ أثناء تنفيذ الفصل: ' + err.message, true);
      }
    }

    async function handleInputSubmit() {
      const input = document.getElementById('directorInput');
      const val = input.value.trim();
      if (!val) return;

      if (val === 'نفذ' || val.includes('نفذ الصوت') || val.includes('توليد الصوت')) {
        input.value = '';
        executeActiveChapter();
        return;
      }

      showToast('المخرج الذكي ينفذ توجيهك...');
      input.value = '';

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            prompt: val,
            project_id: activeProjectId,
            narration_mode: currentNarratorMode
          })
        });
        const data = await res.json();
        if (data.metadata && data.metadata.scenes) {
          activeProject.scenes = data.metadata.scenes;
          renderWorkspace();
        } else {
          selectProject(activeProjectId);
        }
        showToast('تم تحديث السيناريو.');
      } catch (e) {
        showToast('تعذر الإرسال: ' + e.message, true);
      }
    }

    // =========================================================================
    // FILE UPLOAD (NOVELS)
    // =========================================================================
    async function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      showToast(`جاري استيراد وتحليل (${file.name})...`);
      const formData = new FormData();
      formData.append('file', file);
      formData.append('prompt', 'تحليل الرواية وتقسيمها لفصول واستخراج الشخصيات');
      formData.append('narration_mode', currentNarratorMode);

      try {
        const res = await fetch('/api/upload-book', {
          method: 'POST',
          body: formData
        });
        const data = await res.json();
        showToast('تم استيراد الرواية واستخراج الفصول!');
        if (data.project_id) {
          window.location.href = `?project_id=${data.project_id}`;
        }
      } catch (err) {
        showToast('خطأ أثناء رفع الرواية: ' + err.message, true);
      }
    }

    // =========================================================================
    // VOICE CASTING MODAL (Minimal Popover)
    // =========================================================================
    function openVoiceModal(charName, currentVoice) {
      targetCharForVoice = charName;
      selectedVoiceForModal = currentVoice || 'Charon';
      document.getElementById('modalCharName').textContent = `تخصيص صوت: ${charName}`;

      const list = document.getElementById('voiceOptionsList');
      list.innerHTML = (availableVoices || []).map(v => {
        const isSelected = v.name === selectedVoiceForModal;
        return `
          <div 
            onclick="selectModalVoice('${v.name}')" 
            id="vopt-${v.name}"
            class="p-2.5 rounded-xl border ${isSelected ? 'border-limeAccent bg-obsidian text-white' : 'border-borderSubtle bg-surface text-muted hover:text-white'} flex items-center justify-between cursor-pointer transition"
          >
            <div>
              <div class="text-xs font-medium text-white flex items-center gap-1.5">
                <span>${v.name}</span>
                <span class="text-[10px] font-mono text-zinc-500">(${v.gender})</span>
              </div>
              <p class="text-[10px] text-zinc-400 mt-0.5">${v.description}</p>
            </div>
            <button type="button" onclick="event.stopPropagation(); previewVoiceSample('${v.name}')" class="p-1 rounded-lg hover:bg-surfaceHover text-limeAccent" title="معاينة الصوت">
              <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20 6 4"></polygon></svg>
            </button>
          </div>
        `;
      }).join('');

      document.getElementById('voiceModal').classList.remove('hidden');
    }

    function selectModalVoice(voiceName) {
      selectedVoiceForModal = voiceName;
      (availableVoices || []).forEach(v => {
        const el = document.getElementById(`vopt-${v.name}`);
        if (!el) return;
        if (v.name === voiceName) {
          el.className = 'p-2.5 rounded-xl border border-limeAccent bg-obsidian text-white flex items-center justify-between cursor-pointer transition';
        } else {
          el.className = 'p-2.5 rounded-xl border border-borderSubtle bg-surface text-muted hover:text-white flex items-center justify-between cursor-pointer transition';
        }
      });
    }

    function previewVoiceSample(voiceName) {
      showToast(`معاينة صوت: ${voiceName}`);
      const toneMap = { 'Charon': 95, 'Puck': 130, 'Fenrir': 110, 'Kore': 220, 'Aoede': 260 };
      const freq = toneMap[voiceName] || 130;
      
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.8);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.8);
      } catch (e) {}
    }

    async function saveVoiceAssignment() {
      if (!targetCharForVoice || !selectedVoiceForModal || !activeProject) return;

      const charObj = (activeProject.characters || []).find(c => c.name === targetCharForVoice);
      if (charObj) {
        charObj.assigned_voice = selectedVoiceForModal;
        try {
          await fetch(`/api/projects/${activeProjectId}/update-characters`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              updates: [{ character_id: charObj.id, assigned_voice: selectedVoiceForModal }]
            })
          });
        } catch (e) {}
      }

      // Update in scenes
      (activeProject.scenes || []).forEach(s => {
        if (s.speaker_name === targetCharForVoice) {
          s.voice = selectedVoiceForModal;
        }
      });

      closeVoiceModal();
      renderWorkspace();
      showToast(`تم تعيين صوت (${selectedVoiceForModal}) لـ ${targetCharForVoice}`);
    }

    function closeVoiceModal() {
      document.getElementById('voiceModal').classList.add('hidden');
    }

    // =========================================================================
    // EXPORT MASTER AUDIO DRAMA
    // =========================================================================
    async function exportAudioMaster() {
      if (!activeProjectId) return;
      showToast('جاري تصدير وريندر العمل الصوتي الكامل...');
      try {
        const res = await fetch(`/api/projects/${activeProjectId}/export`, { method: 'POST' });
        const data = await res.json();
        if (data.audio_url) {
          window.open(data.audio_url, '_blank');
          showToast('تم تصدير العمل الصوتي بنجاح!');
        } else {
          showToast(data.message || 'اكتمل التصدير.');
        }
      } catch (err) {
        showToast('تعذر التصدير: ' + err.message, true);
      }
    }
  </script>
</body>
